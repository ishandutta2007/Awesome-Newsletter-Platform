<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Vibrant Gradient for Highlights -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Card/Glow Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03" />
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="glow1" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow2" cx="85%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.75" stroke-opacity="0.06" />
    </pattern>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <style>
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.08); opacity: 1; }
      }
      @keyframes float {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-8px) rotate(1.5deg); }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(10px) rotate(-2deg); }
      }
      @keyframes dash {
        to { stroke-dashoffset: -100; }
      }
      .anim-float { animation: float 6s ease-in-out infinite; transform-origin: center; }
      .anim-float-slow { animation: floatSlow 7s ease-in-out infinite; transform-origin: center; }
      .anim-pulse { animation: pulse 4s ease-in-out infinite; transform-origin: center; }
      .anim-dash { stroke-dasharray: 8, 8; animation: dash 20s linear infinite; }
      .title-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; }
      .subtitle-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; }
      .tag-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="320" rx="16" fill="url(#grid)" />
  <circle cx="250" cy="100" r="280" fill="url(#glow1)" />
  <circle cx="950" cy="220" r="250" fill="url(#glow2)" />

  <!-- Animated Wave Lines in Background -->
  <path class="anim-dash" d="M -50 200 Q 300 120 600 220 T 1250 180" fill="none" stroke="url(#accentGrad)" stroke-width="2" stroke-opacity="0.3" />
  <path class="anim-dash" d="M -50 240 Q 350 300 700 190 T 1250 250" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.2" />

  <!-- Left Icon Illustration: Floating Newsletter / Email -->
  <g class="anim-float" transform="translate(100, 65)">
    <!-- Base Card / Envelope -->
    <rect x="0" y="0" width="130" height="150" rx="14" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1.5" filter="url(#shadow)" />
    <!-- Envelope Flap Shape -->
    <path d="M 10 15 L 65 65 L 120 15" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <!-- Letter Lines -->
    <rect x="25" y="80" width="80" height="6" rx="3" fill="#818cf8" opacity="0.8" />
    <rect x="25" y="96" width="60" height="6" rx="3" fill="#c084fc" opacity="0.8" />
    <rect x="25" y="112" width="70" height="6" rx="3" fill="#38bdf8" opacity="0.8" />
    <!-- Sparkles -->
    <circle cx="120" cy="10" r="4" fill="#38bdf8" class="anim-pulse" />
    <circle cx="10" cy="140" r="3" fill="#f43f5e" class="anim-pulse" />
  </g>

  <!-- Right Floating Analytics / Automation Element -->
  <g class="anim-float-slow" transform="translate(970, 75)">
    <rect x="0" y="0" width="140" height="130" rx="14" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow)" />
    <!-- Mini Bar Chart -->
    <rect x="25" y="85" width="14" height="25" rx="3" fill="#818cf8" />
    <rect x="47" y="65" width="14" height="45" rx="3" fill="#38bdf8" />
    <rect x="69" y="45" width="14" height="65" rx="3" fill="#c084fc" />
    <rect x="91" y="30" width="14" height="80" rx="3" fill="#34d399" />
    <!-- Chart Trend Arrow -->
    <path d="M 25 75 Q 60 40 105 25" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" />
    <polygon points="108,22 100,28 107,31" fill="#fbbf24" />
  </g>

  <!-- Center Content -->
  <g transform="translate(290, 80)">
    <!-- Badge -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="230" height="28" rx="14" fill="#312e81" stroke="#6366f1" stroke-width="1" />
      <circle cx="14" cy="14" r="5" fill="#10b981" class="anim-pulse" />
      <text x="28" y="18" fill="#e0e7ff" class="tag-text">CURATED REPOSITORY</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="70" fill="url(#accentGrad)" class="title-text" font-size="40" letter-spacing="-0.5">
      Awesome Newsletter Platform
    </text>

    <!-- Subtitle -->
    <text x="0" y="105" fill="#94a3b8" class="subtitle-text" font-size="16">
      Top SaaS Products, Open-Source Tools &amp; Self-Hosted Email Infrastructure
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 128)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="135" height="26" rx="13" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="14" y="17" fill="#38bdf8" class="tag-text">⚡ SaaS Platforms</text>

      <!-- Pill 2 -->
      <rect x="145" y="0" width="155" height="26" rx="13" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="159" y="17" fill="#a78bfa" class="tag-text">🛠️ Open-Source Apps</text>

      <!-- Pill 3 -->
      <rect x="310" y="0" width="165" height="26" rx="13" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="324" y="17" fill="#34d399" class="tag-text">📈 Self-Hosted Stack</text>

      <!-- Pill 4 -->
      <rect x="485" y="0" width="125" height="26" rx="13" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="499" y="17" fill="#f472b6" class="tag-text">💰 Free Tiers</text>
    </g>
  </g>
</svg>
